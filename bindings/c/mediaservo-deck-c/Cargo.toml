[package]
name = "mediaservo-deck-c"
build = "build.rs"
version.workspace = true
edition.workspace = true
description = "MediaServo deck C ABI — ms_deck_* opaque handle bindings (采集/录制/回放)"
license.workspace = true

[lib]
name = "mediaservo_deck"
crate-type = ["cdylib"]

[dependencies]
mediaservo-deck = { path = "../../../crates/mediaservo-deck", features = ["backend-ffmpeg"] }
mediaservo-codec = { path = "../../../crates/mediaservo-codec" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
