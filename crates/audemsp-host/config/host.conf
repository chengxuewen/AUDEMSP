# ============================================================
# AUDEMSP Host 配置 — 字段参考（所有可用值 + 示例）
# 加载优先级: --config <path> > crates/audemsp-host/config/host.conf（dev）> /opt/audemsp/etc/host.conf（部署）
# 修改后需重启 host 生效（每次启动重新协商）
# ============================================================

server:
  # 信令服务器 WebSocket 地址（audemsp-server）
  signaling_url: "ws://localhost:9800/ws"
  # 参考: "ws://192.168.1.10:9800/ws"（远程 server）| "wss://host:9800/ws"（TLS）

  # WebRTC ICE 服务器列表（P2P 模式; SFU 模式可留空）
  ice_servers: []
  # 参考: ["stun:stun.l.google.com:19302"]（公网 STUN）| ["turn:relay.example.com:3478?transport=udp"]（TURN）

capture:
  # 采集源类型
  source: "test_pattern"
  # 参考: "test_pattern"（测试图案, 无需设备）| "camera"（相机, v4l2src, 需 device）| "screen"（屏幕捕获, GStreamer 路径）

  # 采集分辨率 "WxH"
  resolution: "1280x720"
  # 参考: "640x480"（低负载）| "1920x1080"（高清）| "3840x2160"（4K, 需足够带宽）

  # 采集帧率（必须与编码器配置匹配, C17 帧率约束）
  framerate: 30
  # 参考: 15（低带宽）| 24 | 30（默认）| 60（高帧率）

  # 相机设备路径（source=camera 时必填）
  device: null
  # 参考: "/dev/video0"（Linux V4L2）| "0"（macOS 相机索引）

encoder:
  # 编码器实现选择（软/硬）— SetEncoderSelector 语义: 偏好非强制, 不可用时自动 fallback 软件
  backend: "auto"
  # 参考:
  #   "auto"          默认, libwebrtc 自动选择
  #   "software"      强制软编（libvpx VP8/VP9, OpenH264）— 最兼容
  #   "hardware"      硬件优先（无 GPU 时 fallback 软件 + warning 日志）
  #   "nvenc"         NVIDIA 硬编（Jetson/GPU 车端）
  #   "vaapi"         Intel/AMD VAAPI 硬编（Linux）
  #   "videotoolbox"  macOS 硬编

  # 目标码率（kbps）
  bitrate_kbps: 2000
  # 参考: 800（低清/低带宽）| 2000（720p 默认）| 4000（1080p）| 8000（4K）

  # 周期关键帧间隔（秒, PIT-76）— GOP 控制: 首帧延迟与带宽权衡
  keyframe_interval: 2  # PIT-76: 周期关键帧间隔（秒）
  # 参考: 1（极低首帧延迟, 带宽高）| 2（默认）| 4（省带宽）; 0 视为 1 防御

  # 编码格式（codec）— 固定 offer codec = 固定实际编码（协商交集一致）
  codec: "auto"  # v2: auto/vp8/h264/vp9/av1 — offer codec 固定（auto=router 决定）
  # 参考:
  #   "auto"  默认, 由 server router codec 顺序决定（当前 VP8 优先）
  #   "vp8"   强制 VP8（兼容性最好）
  #   "h264"  强制 H.264（带宽效率高, 车端常见; 浏览器需支持）
  #   "vp9"   VP9（若 router 无 VP9 → produce 失败 Error 5000, 负向场景）
  #   "av1"   AV1（同上, router 需支持）

room:
  # 房间 ID（Host 与 Client/浏览器同房间才能互见）
  id: "test-room"
  # 参考: "room-001"（多房间隔离）| "car-01"（车端命名）

# SFU produce 模式: true = 推流到 mediasoup SFU（当前主路径）; false = P2P 直连（webrtc-p2p feature）
sfu_produce: true
# 参考: true（SFU 推流, 浏览器经 admin consume）| false（P2P, 需对端在线）

# 信令认证 PSK（与 server 的 AUDEMSP_PSK / server 配置一致）
psk: "audemsp-dev"
# 参考: 任意字符串, 必须与 audemsp-server 配置的 PSK 相同, 否则认证失败
