[package]
name = "mediaservo-deck"
version.workspace = true
edition.workspace = true
description = "MediaServo Deck — 媒体数据面 SDK: source(采集)/record(录制)/ playback(回放) 会话"
license.workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync"] }

# 帧源生成（CameraSource stub）— VideoFrameGenerator
mediaservo-media = { path = "../mediaservo-media", default-features = false, features = ["backend-native"] }

# 编解码 facade（D229: deck 依赖 codec，不合并）
mediaservo-codec = { path = "../mediaservo-codec" }

# 帧总线（link IPC 传输）
mediaservo-link = { path = "../mediaservo-link" }

# FFmpeg mux（Recorder）
ffmpeg-the-third = { version = "6", optional = true }

[features]
default = []
backend-ffmpeg = ["dep:ffmpeg-the-third"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
