name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # PR 构建校验只跑构建相关变更（防 Dockerfile/compose 破坏合入，PIT-39 教训）
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'

jobs:
  docker-build:
    runs-on: ubuntu-22.04  # mediasoup prebuild base (widest glibc compatibility)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config (PIT-32 gate)
        run: |
          docker compose -f docker-compose.yml config --quiet && echo "prod compose OK"
          docker compose -f docker-compose.dev.yml config --quiet && echo "dev compose OK"
          # Gate: production compose must NOT contain build: (image:+build: anti-pattern)
          if grep -qE '^\s+build:' docker-compose.yml; then
            echo "ERROR: docker-compose.yml contains build: — PIT-32 anti-pattern (image: never pulled)"
            exit 1
          fi

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR: build-only 校验（不推送）；push: 构建并写入 gha cache 供 runtime 步骤复用
      - name: Build builder stage
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: builder
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          target: runtime
          tags: |
            ghcr.io/org/omspbase-server:latest
            ghcr.io/org/omspbase-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # PIT-39 gate: 构建通过 ≠ 产物可运行 — push 后必须冒烟验证 runtime 镜像
      - name: Smoke test runtime image (PIT-39 gate)
        if: github.event_name == 'push'
        run: |
          docker run --rm -d --name omspbase-smoke -p 9800:9800 \
            ghcr.io/org/omspbase-server:sha-${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -sf http://localhost:9800/health > /dev/null 2>&1; then
              echo "SMOKE OK: runtime image health endpoint 200"
              docker stop omspbase-smoke
              exit 0
            fi
            sleep 3
          done
          docker logs omspbase-smoke 2>&1 | tail -30
          echo "SMOKE FAILED: runtime image did not become healthy in 30s"
          exit 1
