name: Docker

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-22.04  # mediasoup prebuild base (widest glibc compatibility)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder stage
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: builder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runtime
          tags: |
            ghcr.io/org/omspbase-server:latest
            ghcr.io/org/omspbase-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
