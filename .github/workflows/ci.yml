name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-gstreamer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: "0.67.2"
          cache: true
      - run: pixi run test-gstreamer

  test-mediasoup:
    runs-on: ubuntu-22.04  # mediasoup prebuild base (widest glibc compatibility)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mediasoup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libuv1-dev libssl-dev
      - name: Test audemsp-server (mediasoup)
        run: cargo test -p audemsp-server --features sfu-mediasoup
      - name: Build audemsp-server binary (for external-mode e2e)
        run: cargo build -p audemsp-server --features sfu-mediasoup
      - name: Start audemsp-server for e2e_sfu (pure external mode)
        run: |
          # C21: e2e_sfu 是纯外部模式 — 需真实 server 进程 + WS 信令交互
          # 注意: server 认证用 AUDEMSP_PSK env (main.rs:185), 与 e2e_sfu 的 SFU_E2E_PSK 匹配
          AUDEMSP_PSK="audemsp-dev" nohup ./target/debug/audemsp-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s --noproxy "*" http://127.0.0.1:9800/health 2>/dev/null | grep -q healthy; then
              echo "server ready after ${i}s"; break;
            fi
            sleep 1
          done
          curl -s --noproxy "*" http://127.0.0.1:9800/health || (cat /tmp/server.log; exit 1)
      - name: e2e_sfu (Host→mediasoup→consume, Linux only)
        run: |
          # 首次 Linux 真跑 — CI 覆盖防 C14 假象重演 (PIT-71/72)
          SFU_E2E_WS_URL="ws://127.0.0.1:9800/ws" \
          SFU_E2E_PSK="audemsp-dev" \
          cargo test -p audemsp-host --test e2e_sfu

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p audemsp-server

  openapi-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        run: |
          python3 -c "
          import yaml, sys
          with open('docs/openapi.yaml') as f:
              spec = yaml.safe_load(f)
          assert spec.get('openapi') == '3.0.3', 'not OpenAPI 3.0.3'
          assert spec.get('info', {}).get('title'), 'missing info.title'
          assert spec.get('info', {}).get('version'), 'missing info.version'
          assert 'paths' in spec, 'missing paths'
          for path, methods in spec['paths'].items():
              for method, detail in methods.items():
                  assert 'responses' in detail, f'{path} {method} missing responses'
          print('OpenAPI spec valid: ' + spec['info']['title'] + ' v' + spec['info']['version'])
          "
