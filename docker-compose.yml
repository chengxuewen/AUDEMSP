# Production docker-compose — image-based, no build context
name: mediaservo
services:
  server:
    image: ghcr.io/org/mediaservo-server:latest
    ports:
      - "9800:9800"
      - "20000:20000/udp"
      - "40000-40100:40000-40100/udp"
    environment:
      RUST_LOG: debug
      MEDIASERVO_PSK: mediaservo-dev
      # I2 review: accounts.docker.yaml 含 dev 占位账号（admin123 等）—
      # 启动守卫 fail-fast；dev 环境显式豁免（生产部署必须移除占位账号）。
      MEDIASERVO_ALLOW_DEV_CREDENTIALS: "1"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "1"
          memory: "2G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9800/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./config/server.docker.yaml:/opt/mediaservo/etc/server.yaml:ro
      - ./config/devices.docker.yaml:/opt/mediaservo/etc/devices.yaml:ro
      - ./config/accounts.docker.yaml:/opt/mediaservo/etc/accounts.yaml:ro

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
    restart: unless-stopped