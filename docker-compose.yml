# Production docker-compose — image-based, no build context
services:
  server:
    image: ghcr.io/org/audemsp-server:latest
    ports:
      - "40000-40100:40000-40100/udp"
    environment:
      RUST_LOG: debug
      AUDEMSP_PSK: audemsp-dev
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "1"
          memory: "2G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9800/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./config/server.docker.yaml:/opt/audemsp/etc/server.yaml:ro

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
    restart: unless-stopped