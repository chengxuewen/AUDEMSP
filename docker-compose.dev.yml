# Development docker-compose — build-based, source mount
services:
  server:
    build:
      context: .
      target: dev
      args:
        HTTP_PROXY: ${http_proxy:-}
        HTTPS_PROXY: ${https_proxy:-}
        NO_PROXY: ${no_proxy:-}
    ports:
      - "9800:9800"
      - "20000:20000/udp"
      - "40000-40100:40000-40100/udp"
    environment:
      RUST_LOG: debug
      AUDEMSP_PSK: audemsp-dev
      # 容器内进程（mediasoup-sys meson wrapdb）需要独立代理 (PIT-38)
      HTTP_PROXY: ${http_proxy:-}
      HTTPS_PROXY: ${https_proxy:-}
      NO_PROXY: ${no_proxy:-}
    volumes:
      - .:/workspace
      - ./config/server.docker.yaml:/opt/audemsp/etc/server.yaml:ro
      - cargo-cache:/workspace/target
    command: cargo run --bin audemsp-server --features sfu-mediasoup,admin-dashboard
    cap_add:
      - SYS_PTRACE  # 调试: 容器内 gdb attach (produce 挂起诊断)

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  cargo-cache: