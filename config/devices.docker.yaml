# MediaServo G2 设备注册表 — server 侧设备凭证（D-H11 连接级身份）
#
# 配发流程:
#   1. 车端 `mediaservo host init` 生成实例身份 identity.json（device_id: ms-<12hex>, device_secret: <64hex>）
#   2. 运维把 device_id/device_secret 拷入本文件:
#      - Linux:   echo -n "<device_id>:<device_secret>" | sha256sum  → 得 64 hex
#      - 便捷:    mediaservo server hash-device <device_id> <secret>  （H 阶段 CLI）
#   3. 填入 secret_hash: "sha256:<上面得到的 64 hex>"
#   4. 重启 server（`./mediaservo.sh restart server`）— 注册表启动时加载
#
# 存储决策 (G2): 客户端经 TLS 在 wire 上明文携带 secret（与 PSK 同级），
# 注册表仅存 sha256(device_id + ":" + device_secret) 单向哈希 — device_id 充当每设备盐。
# 比较用常量时间（subtle），防时序侧信道。升级路径: H 阶段换 argon2id（前缀 argon2:）。
# 删除设备: 删掉对应条目即可（新连接立即拒绝，已连接会话保持到断开）。
# 错误码: 认证失败统一 Error 4010（未知设备/错误 secret/半带凭证共用，消息区分 — 防设备枚举）。
#
# 示例（占位 — 请删除或替换）:
# devices:
#   ms-0a1b2c3d4e5f:
#     secret_hash: "sha256:2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"
devices: {}
